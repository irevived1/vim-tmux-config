[colors.primary]
background = "#21252b"

[env]
TERM = "xterm-256color"

[font]
size = 12

[font.bold]
family = "DejaVuSansM Nerd Font Mono"

[font.italic]
family = "DejaVuSansM Nerd Font Mono"

[font.normal]
family = "DejaVuSansM Nerd Font Mono"

[keyboard]

[[keyboard.bindings]]
chars = "\u001F"
key = "Slash"
mods = "Control"

